// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        jcenter()
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        google()
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.0'//3.1.4'
        //classpath 'com.android.tools.build:gradle-experimental:0.11.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        //jcenter()

        maven {
            url 'https://maven.google.com/'
            content { excludeGroupByRegex "com\\.github.jonfinerty.*" }
            name 'Google'
        }
        mavenCentral()

        maven {
            url "https://jitpack.io"
            content { includeGroup "com.github.jonfinerty" }
        }

    }

}

task clean(type: Delete) {
    delete rootProject.buildDir
}
